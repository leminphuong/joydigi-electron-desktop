name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npx electron-builder --win nsis --publish never
            name: windows
          - os: ubuntu-latest
            command: npx electron-builder --linux AppImage deb --publish never
            name: linux
          - os: macos-15
            command: npx electron-builder --mac dmg --publish never
            name: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joydigi-${{ matrix.name }}
          path: dist/**
          if-no-files-found: error
